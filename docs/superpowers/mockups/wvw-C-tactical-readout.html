<!-- Source of truth for the WvW feature-row mock: tactical readout (mini objective map + live standings). -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#05060d;--ink:#eaf6ff;--muted:#8ea2c4;--cyan:#46e6ff;--mag:#c764ff;--teal:#39ffd0;--font:'Inter',sans-serif;--display:'Chakra Petch',sans-serif;--mono:'JetBrains Mono',monospace;}
*{margin:0;box-sizing:border-box}body{background:var(--bg);color:var(--ink);font-family:var(--font)}
.hud{position:relative;max-width:520px;margin:60px auto;background:linear-gradient(160deg,rgba(12,16,28,.94),rgba(7,9,17,.96));border:1px solid rgba(70,230,255,.18);border-radius:4px;box-shadow:0 40px 90px rgba(0,0,0,.6)}
.hud .top{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid rgba(255,255,255,.08);font-family:var(--mono);font-size:12px;color:var(--muted)}
.hud .top b{color:var(--cyan);font-weight:600}
.pulse{width:7px;height:7px;border-radius:50%;background:var(--cyan);box-shadow:0 0 8px var(--cyan)}
.mmap{height:150px;margin:14px 18px 0;border:1px solid rgba(255,255,255,.08);border-radius:3px;position:relative;overflow:hidden;background:radial-gradient(40% 60% at 30% 40%,rgba(70,230,255,.12),transparent),radial-gradient(40% 60% at 75% 65%,rgba(199,100,255,.12),transparent)}
.mmap .obj{position:absolute;font-family:var(--mono);font-size:10px;padding:2px 6px;border-radius:3px;color:#05060d;font-weight:700}
.rank{padding:14px 18px 18px;font-family:var(--mono);font-size:13px}
.rk{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px dashed rgba(255,255,255,.08)}
.rk:last-child{border:0}.rk .p{width:20px;color:var(--muted)}.rk .n{flex:1;color:#dbeaff}.rk .v{color:var(--teal)}
.rk.you .n{color:var(--cyan);font-weight:600}
</style></head>
<body>
<div class="hud">
 <div class="top"><span class="pulse"></span> <b>/wvw matchup</b> &nbsp;·&nbsp; reset in 2d 04h</div>
 <div class="mmap">
  <span class="obj" style="top:30%;left:22%;background:var(--cyan)">BG</span>
  <span class="obj" style="top:56%;left:60%;background:var(--teal)">YOU</span>
  <span class="obj" style="top:70%;left:30%;background:var(--mag)">MAG</span>
 </div>
 <div class="rank">
  <div class="rk"><span class="p">1</span><span class="n">Blackgate</span><span class="v">214k</span></div>
  <div class="rk you"><span class="p">2</span><span class="n">Your Link ▸ Mists Vanguard</span><span class="v">198k</span></div>
  <div class="rk"><span class="p">3</span><span class="n">Maguuma</span><span class="v">176k</span></div>
 </div>
</div>
</body></html>
